<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Clientes</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header__alt" >
		<div class="contenedor">
			<div class="barra">
				<a href="index.html" class="logo">
				<h1 class="logo__nombre no-margin centrar-texto">App<span  class="logo__bold">ClienteCorreo</span></h1>
				</a>
			</div>
		</div>
	</header>
    <div class="contenedor">
        <button class="btn-lila" type="button" onclick="window.location.href='clientes.html'">
				Volver
				<svg
				xmlns="http://www.w3.org/2000/svg"
				width="32"
				height="32"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="1.5"
				stroke-linecap="round"
				stroke-linejoin="round"
				>
				<path d="M9 11l-4 4l4 4m-4 -4h11a4 4 0 0 0 0 -8h-1" />
				</svg>
			</button>
        <div class="contenedor-form">
            <h2>Editar Clientes</h2> 
            <form id="EditarClienteForm">
                DNI: <input type="text" id="dni" name="dni" value="Cargando dni..." disabled required><br>
                Nombre: <input type="text" id="nombre" name="nombre" value="Cargando nombre..." required><br>
                Apellido: <input type="text" id="apellido" name="apellido" value="Cargando apellido..." required><br>
                Fecha de Nacimiento: <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                Nacionalidad: <select id="nacionalidad" name="nacionalidad" required>
						<option value="" selected disabled hidden>Cargando nacionalidad...</option>
					</select>
                <button class="btn-verde" type="submit" name="Enviar">
						Enviar
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="30"
							height="30"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.5"
							stroke-linecap="round"
							stroke-linejoin="round"
							>
							<path d="M15 10l-4 4l6 6l4 -16l-18 7l4 2l2 6l3 -4" />
						</svg>
					</button>
            </form>
        </div>
    </div>

</body>
<script>
    function cargarNacionalidadEditar(idPaisOriginal){
        const nacionalidadSelect = document.getElementById("nacionalidad");
        fetch("nacionalidad/listarPaises")
		.then(results => results.json())
		.then(results => {
			results.forEach(nacionalidad => {
				const option = new Option(nacionalidad.pais, nacionalidad.id);

                if (idPaisOriginal == nacionalidad.id) {
                    option.defaultSelected = true;
                }

				nacionalidadSelect.add(option)
			});
		})
    }

    window.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const dniParam = urlParams.get("dni")
        const dni = document.getElementById("dni")
        const nombre = document.getElementById("nombre");
        const apellido = document.getElementById("apellido");
        const fechaNacimiento = document.getElementById("fechaNacimiento");
        const nacionalidad = document.getElementById("nacionalidad");
        fetch(`clientes/buscarpordni?dni=${dniParam}`)
        .then(results => results.json())
        .then(results => {
            if (results.dni == null) {
                window.location.replace("clientes.html");
            }
            dni.value = results.dni
            nombre.value = results.nombre
            apellido.value = results.apellido
            fechaNacimiento.value = results.fechaNacimiento;
            cargarNacionalidadEditar(results.nacionalidad.id);
        })
    })
    
    document.getElementById("EditarClienteForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const dni = document.getElementById("dni").value.trim();
        const nombre = document.getElementById("nombre").value.trim();
        const apellido = document.getElementById("apellido").value.trim();
        const fechaNacimiento = document.getElementById("fechaNacimiento").value;
        const nacionalidad = document.getElementById("nacionalidad").value
        fetch(`clientes/actualizar/${dni}`, {
            method: "PUT",
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                nombre: nombre,
                apellido: apellido,
                fechaNacimiento: fechaNacimiento,
                nacionalidadId: nacionalidad
            })
        })
        .then(async results => {
			if (!results.ok) {
				const message = await results.text();
				return alert(message)
			}

			const message = await results.text();
			alert(message)
			window.location.replace("clientes.html")
			
		})
    });
</script>
</html>
