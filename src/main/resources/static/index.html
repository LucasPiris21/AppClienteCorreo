<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Agenda de Correos</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header" >
    <div class="contenedor">
      <div class="barra">
        <a href="index.html" class="logo">
          <h1 class="logo__nombre no-margin centrar-texto">App<span  class="logo__bold">ClienteCorreo</span></h1>
        </a>
        <nav class="navegacion">
          <a class="navegacion__enlace" href="clientes.html">Clientes</a>
          <a class="navegacion__enlace" href="correos.html">Correos</a>
        </nav>
      </div>
    </div>
    <div class="header__texto">
      <h2 class="no-margin">Sistema Agenda de Correos</h2>
      <p class="no-margin">Administra tus clientes y sus correos electrónicos de manera eficiente</p>
    </div>
  </header>
  <div class="contenedor">
    <h3>Cliente-Correos</h3>
    <div class="table-scroll">
      <table class="table-container">
          <thead>
              <tr class="centrar-texto">
                  <th class="centrar-texto">DNI</th>
                  <th class="centrar-texto">Nombre</th>
                  <th class="centrar-texto">Apellido</th>
                  <th class="centrar-texto">Fecha de Nacimiento</th>
                  <th class="centrar-texto">Nacionalidad</th>
                  <th class="centrar-texto">ID Nacionalidad</th>
                  <th class="centrar-texto">Pais</th>
                  <th class="centrar-texto">ID Correo</th>
                  <th class="centrar-texto">Correo</th>
                  <th class="centrar-texto">Cliente</th>
              </tr>
          </thead>
          <tbody id="tabla-clientesCorreos">
  
          </tbody>
      </table>
    </div>
  </div>
</body>
<script>
    fetch('/correos/listarClientesCorreos')
    .then(clientesCorreos => clientesCorreos.json())
    .then(clientesCorreos => {
        const tablaClientesCorreos = document.getElementById("tabla-clientesCorreos");
        clientesCorreos.forEach(clienteCorreo => {
            console.log(clienteCorreo)
            tablaClientesCorreos.innerHTML += `
            <tr>
                <td>${clienteCorreo[0]}</td>
                <td>${clienteCorreo[1]}</td>
                <td>${clienteCorreo[2]}</td>
                <td>${clienteCorreo[3]}</td>
                <td>${clienteCorreo[4]}</td>
                <td>${clienteCorreo[5]}</td>
                <td>${clienteCorreo[6]}</td>
                <td>${clienteCorreo[7]}</td>
                <td>${clienteCorreo[8]}</td>
                <td>${clienteCorreo[9]}</td>
            </tr>
            `; 
        });

    })
</script>
</html>
