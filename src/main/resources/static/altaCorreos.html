<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta de Correos</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
	<header class="header__alt" >
    <div class="contenedor">
        <div class="barra">
            <a href="index.html" class="logo">
            <h1 class="logo__nombre no-margin centrar-texto">App<span  class="logo__bold">ClienteCorreo</span></h1>
            </a>
        </div>
    </div>
    </header>
	<div class="contenedor">
		<button class="btn-lila" type="button" onclick="window.location.href='correos.html'">
                Volver
                <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                >
                <path d="M9 11l-4 4l4 4m-4 -4h11a4 4 0 0 0 0 -8h-1" />
                </svg>
				</button>
					<div class="contenedor-form">
						<h2>Alta de Correos</h2>
						<form id="altaCorreosForm" method="get" target="salidaAltaCorreos">
							DNI: <select id="dni" name="dni" required>
								<option value="" selected disabled hidden>-- Seleccionar DNI --</option>
							</select>
							Correo: <input type="email" id="correo" name="correo" placeholder="usuario@servidor.com" required><br> 
									<button class="btn-verde" type="submit" name="Enviar">
					Enviar
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="30"
						height="30"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.5"
						stroke-linecap="round"
						stroke-linejoin="round"
						>
						<path d="M15 10l-4 4l6 6l4 -16l-18 7l4 2l2 6l3 -4" />
					</svg>
				</button>

				</form>
			</div>
	</div>

</body>

<script>
	window.addEventListener("DOMContentLoaded", () => {
		const dniSelect = document.getElementById("dni");
		fetch("clientes/listartodos")
		.then(results => results.json())
		.then(results => {
			results.forEach(cliente => {
				const option = new Option(`${cliente.dni} (${cliente.apellido} ${cliente.nombre})`, cliente.dni);
				dniSelect.add(option)
			});
		})
	});

	document.getElementById("altaCorreosForm").onsubmit = function(event) {
		event.preventDefault(); // Evita el envío predeterminado del formulario
		const dni = document.getElementById("dni").value.trim();
		const correo = document.getElementById("correo").value.trim();

		fetch('correos/guardar', {
			method: "POST",
			headers: {
				'Content-Type': 'application/json'
			},
			body: JSON.stringify({
				correo: correo,
				clienteDni: dni
			})
		})
		.then(async results => {
			if (!results.ok) {
				const message = await results.text();
				return alert(message)
			}

			const message = await results.text();
			alert(message)
			window.location.replace("correos.html")
			
		})
	};
</script>
</html>
